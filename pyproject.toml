[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traceforge"
dynamic = ["version"]
description = "Local incident reconstruction and IOC correlation workbench"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "pandas>=2.2", "numpy>=1.26",
  "reportlab>=4.2", "matplotlib>=3.8", "PyYAML>=6.0", "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pypdf>=6.21.4", "httpx>=0.27", "ruff>=0.5", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
traceforge = "traceforge.cli:main"

[tool.setuptools.dynamic]
version = {attr = "traceforge.__version__"}

[tool.setuptools.packages.find]
include = ["traceforge*"]

[tool.setuptools.package-data]
traceforge = ["web/*", "sample_data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 200
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["traceforge"]
