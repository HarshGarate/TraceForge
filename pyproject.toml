[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traceforge"
dynamic = ["version"]
description = "Local incident reconstruction and IOC correlation workbench"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Harsh Garate"}]
keywords = ["incident-response", "dfir", "log-analysis", "ioc", "sigma", "mitre-attack", "stix", "soc", "threat-hunting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Logging",
]
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.54.0", "python-multipart>=0.0.9", "pandas>=2.2", "numpy>=1.26",
  "reportlab>=4.2", "matplotlib>=3.8", "PyYAML>=6.0", "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pypdf>=5", "httpx>=0.27", "ruff>=0.5", "bandit>=1.7", "pip-audit>=2.7"]

[project.urls]
Documentation = "https://github.com/YOUR-USERNAME/traceforge/tree/main/docs"
Changelog = "https://github.com/YOUR-USERNAME/traceforge/blob/main/CHANGELOG.md"
Issues = "https://github.com/YOUR-USERNAME/traceforge/issues"

[project.scripts]
traceforge = "traceforge.cli:main"

[tool.setuptools.dynamic]
version = {attr = "traceforge.__version__"}

[tool.setuptools.packages.find]
include = ["traceforge*"]

[tool.setuptools.package-data]
traceforge = ["web/*", "sample_data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = [
  # third-party notice from FastAPI's TestClient; not actionable in this project
  "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 200
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["traceforge"]

[tool.coverage.report]
fail_under = 90
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
