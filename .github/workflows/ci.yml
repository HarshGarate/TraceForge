name: CI
on:
  push: {branches: [main]}
  pull_request:
  schedule: [{cron: "0 6 * * 1"}]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "${{ matrix.python-version }}", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python scripts/generate_sample_data.py && git diff --exit-code traceforge/sample_data
      - run: python scripts/generate_rule_docs.py && git diff --exit-code docs/DETECTION_RULES.md
      - run: python -m pytest -q --cov=traceforge --cov-report=term-missing
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: bandit -r traceforge -ll
      - run: pip-audit -r requirements.txt
