name: CI
on:
  push: {branches: [main]}
  pull_request:
  schedule: [{cron: "0 6 * * 1"}]
permissions: {contents: read}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "${{ matrix.python-version }}", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q --cov=traceforge --cov-report=term-missing --cov-fail-under=90

  reproducibility:
    name: generated files are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/generate_sample_data.py && git diff --exit-code traceforge/sample_data
      - run: python scripts/generate_rule_docs.py && git diff --exit-code docs/DETECTION_RULES.md
      - run: python scripts/generate_scenario_pack.py && git diff --exit-code lab_data

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: python -m pip install -r requirements-dev.txt
      - run: bandit -r traceforge -ll
      - run: pip-audit -r requirements.txt

  package:
    name: wheel installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python -m pip install build twine
      - run: python -m build && twine check dist/*
      - name: install the wheel and run it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/traceforge --version
          SAMPLES="$(/tmp/smoke/bin/python -c 'import traceforge,pathlib;print(pathlib.Path(traceforge.__file__).parent/"sample_data")')"
          # the demo data contains a critical incident, so the gate must exit with status 2;
          # GitHub runs this with `bash -e`, so capture the status instead of letting it abort the step
          rc=0
          /tmp/smoke/bin/traceforge analyze "$SAMPLES"/* --fail-on critical || rc=$?
          echo "exit status: $rc"
          test "$rc" -eq 2

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t traceforge:ci .
      - run: docker run --rm traceforge:ci traceforge --version
