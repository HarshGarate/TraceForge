services:
  traceforge:
    build: .
    ports: ["127.0.0.1:8000:8000"]      # published on localhost only
    environment:
      TRACEFORGE_TOKEN: "${TRACEFORGE_TOKEN:?set TRACEFORGE_TOKEN to a long random value}"
    volumes: ["traceforge-data:/data"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  traceforge-data:
